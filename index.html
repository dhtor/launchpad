<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/theme.js?v=1"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaunchPad</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>
  <div class="page home-page">
    <button class="icon-btn theme-toggle" id="themeToggle" type="button" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="10" cy="10" r="4" />
        <path d="M10 1v2M10 17v2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M1 10h2M17 10h2M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4" stroke-linecap="round" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 20 20" fill="currentColor">
        <path d="M17 10.5A7.5 7.5 0 019.5 3 7.5 7.5 0 1017 10.5z" />
      </svg>
    </button>
    <div class="home-brand">
      <img class="brand-logo" src="logo.png" alt="LaunchPad logo" />
      <h1>Launch<span class="dot">Pad</span></h1>
    </div>

    <form class="gsearch" action="https://www.google.com/search" method="get">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" name="q" placeholder="Search Google…" autofocus autocomplete="off" />
    </form>

    <div class="board-grid" id="boardGrid"></div>

    <p class="footer-hint">
      Click a launchpad to open it, or the pencil to edit its links and colors. Set this page as your browser
      homepage to replace your new-tab page.
    </p>
  </div>

  <script src="js/home.js?v=2"></script>
</body>
</html>
